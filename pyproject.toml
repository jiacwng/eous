[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eous"
version = "0.0.1"
description = "Code-similarity digests for native PE and ELF binaries (x86/x86-64)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

dependencies = [
    "lief>=1.0,<1.1",
    "capstone>=5.0.1,<5.1",
    "numpy>=1.24,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]
die = [
    "die-python>=0.5,<0.6",
]
repro = [
    "scikit-learn>=1.3,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["eous"]

[tool.setuptools.package-data]
eous = ["data/*.json"]
