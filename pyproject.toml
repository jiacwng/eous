[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eous"
version = "0.0.1"
description = "Code-similarity digests for native PE and ELF binaries (x86/x86-64)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

dependencies = [
    "lief>=1.0,<1.1",
    "capstone>=5.0.1,<5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]
die = [
    "die-python>=0.5,<0.6",
]
repro = [
    "scikit-learn>=1.3,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["eous"]

[tool.setuptools.package-data]
eous = ["data/*.json"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; random builds test data rather than secrets
"tests/**" = ["S101", "S311"]

[tool.mypy]
files = ["src"]
strict = true

# capstone ships no py.typed marker, so its types are unavailable to the checker.
[[tool.mypy.overrides]]
module = "capstone.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=eous --cov-report=term-missing --cov-fail-under=90"
