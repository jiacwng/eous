[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "eous"
version = "0.1.0"
description = "Fuzzy hashing tool for PE and ELF binaries on x86 and x86-64"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Jiacheng Wang" }]
keywords = [
    "binary-analysis",
    "similarity",
    "minhash",
    "fuzzy-hashing",
    "disassembly",
    "pe",
    "elf",
    "malware",
]
# A License classifier alongside the PEP 639 expression above is rejected at upload.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Typing :: Typed",
]

dependencies = [
    "lief==1.0.0",
    "numpy>=1.24,<3",
]

[project.urls]
Homepage = "https://github.com/jiacwng/eous"
Repository = "https://github.com/jiacwng/eous"
Issues = "https://github.com/jiacwng/eous/issues"

[project.scripts]
eous = "eous.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "eous._native"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; random builds test data rather than secrets; subprocess runs eous
"tests/**" = ["S101", "S311", "S603"]

[tool.mypy]
files = ["src"]
strict = true

[tool.coverage.run]
concurrency = ["multiprocessing"]
parallel = true
source = ["eous"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=eous --cov-report=term-missing --cov-fail-under=90"
