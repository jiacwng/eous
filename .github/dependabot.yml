version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # iced-x86, lief and numpy stay ungrouped: a decoder bump moves every digest.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
