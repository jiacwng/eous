version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # lief and numpy stay ungrouped: a parser bump can move a digest.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"

  # iced-x86 is pinned exactly, so its bump PR is the signal to regenerate the vectors.
  - package-ecosystem: cargo
    directory: "/native"
    schedule:
      interval: monthly
