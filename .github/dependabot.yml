# Bump PRs for the actions, the pinned CI tools and the Rust crates; an iced-x86 bump means regenerating the vectors.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directories: ["/", "/.github"]
    schedule:
      interval: monthly
    groups:
      dev-tools:
        patterns:
          - "coverage"
          - "maturin"
          - "mypy"
          - "pytest*"
          - "ruff"

  - package-ecosystem: cargo
    directory: "/native"
    schedule:
      interval: monthly
