[package]
name = "eous-native"
version = "0.3.0"
edition = "2021"
description = "The native digest pipeline of eous"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
blake2b_simd = "1.0.5"
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py312"], optional = true }
serde_json = "1.0.154"

[features]
default = ["python"]
python = ["dep:pyo3"]

[profile.release]
lto = true
codegen-units = 1
